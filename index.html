<html>
<head>
    <title>Evergreen Map</title>
    <script src="data.js" defer></script>
    <script src="game.js" defer></script>
    <style>
        body {transition: background-color 0.5s ease;}
        input {background: transparent; border-style: solid; border-radius: 5px; transition: color 0.5s ease; transition: border-color 0.5s ease;}
        pre {white-space: pre-wrap}
        #output-log {height: 400px; width: 800px; overflow-y: auto; transition: color 0.5s ease;}
    </style>
</head>
<body>
    <form id="reset-form">
        <button id="reset-button" type="submit">Reset</button>
    </form>
    <div id="output-log"></div>
    <form id="input-form">
        <input id="text-input" type="text" autofocus autocomplete="off"></input>
    </form>
</body>
</html>
