<!DOCTYPE html>
<html>
<head>
    <title>Evergreen Map</title>
    <link rel="stylesheet" href="style.css">
    <script src="data.js" defer></script>
    <script src="game.js" defer></script>
</head>
<body>
    <div id="v-container">
        <div id="button-container">
            <form id="reset-form">
                <button id="reset-button" type="submit">Reset</button>
            </form>
            <form id="expansion-0-form">
                <button id="expansion-0-button" type="submit">Expansion 0</button>
            </form>
            <form id="expansion-1-form">
                <button id="expansion-1-button" type="submit">Expansion 1</button>
            </form>
            <form id="expansion-2-form">
                <button id="expansion-2-button" type="submit">Expansion 2</button>
            </form>
            <form id="expansion-3-form">
                <button id="expansion-3-button" type="submit">Expansion 3</button>
            </form>
        </div>
        
        <div id="output-log"></div>
        <form id="input-form">
            <input id="text-input" type="text" autofocus autocomplete="off" placeholder="look"></input>
        </form>
    </div>
</body>
</html>
